services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    dns:
      - 1.1.1.1
      - 8.8.8.8
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - backend_logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped

  seed:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "app.seeder.seed"]
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"

  mongodb:
    image: mongo:7.0
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  status-test:
    image: kennethreitz/httpbin
    restart: unless-stopped

volumes:
  backend_logs:
  mongodb_data:
